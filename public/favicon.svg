<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <!-- from-primary (#E14D28) → to-primary/70 (~#E87855) — matches Logo gradient -->
      <stop offset="0%" stop-color="#E14D28"/>
      <stop offset="100%" stop-color="#E87855"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background — mirrors Logo's rounded-2xl -->
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>

  <!--
    Lucide Flame path (v0.575.0):
      d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
    Original viewBox: 24×24. We scale to ~18×18 and center in 32×32:
      scale = 18/24 = 0.75
      offset = (32 - 18) / 2 = 7
    stroke-width compensated for scale: 2 / 0.75 ≈ 2.67
  -->
  <path
    transform="translate(7,7) scale(0.75)"
    d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"
    fill="none"
    stroke="white"
    stroke-width="2.67"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
</svg>
